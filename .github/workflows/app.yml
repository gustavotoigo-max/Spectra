# Compila o Spectra.exe no Windows a cada push.
# Ao criar uma tag v*, publica o .exe numa Release do GitHub
# (é dela que o botão "Baixar" da página puxa o arquivo).
#
#   git tag v0.1.0 && git push origin v0.1.0
name: App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Spectra.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Definir versão
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            "VERSION_ARGS=-p:VersionPrefix=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV
          } else {
            "VERSION_ARGS=-p:VersionSuffix=dev.$($env:GITHUB_RUN_NUMBER)" >> $env:GITHUB_ENV
          }

      - name: Publicar (arquivo único, self-contained)
        shell: pwsh
        run: dotnet publish app/Spectra/Spectra.csproj -c Release -r win-x64 $env:VERSION_ARGS -o out

      - name: Conferir saída
        shell: pwsh
        run: |
          Get-ChildItem out | Format-Table Name, Length
          if (-not (Test-Path out/Spectra.exe)) { throw 'Spectra.exe não foi gerado' }

      - uses: actions/upload-artifact@v4
        with:
          name: Spectra
          path: out/Spectra.exe
          if-no-files-found: error

      - name: Criar release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME out/Spectra.exe --title "Spectra $($env:GITHUB_REF_NAME.Substring(1))" --generate-notes

  worker:
    name: Servidor (Cloudflare Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
