# Publica a página de download (pasta site/) no GitHub Pages.
# Requer, uma vez: Settings → Pages → Source = "GitHub Actions".
name: Página de download

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Endereço do servidor para o aviso de limite de tráfego (variável do repositório, opcional).
      - name: Configurar servidor
        env:
          SPECTRA_SERVER: ${{ vars.SPECTRA_SERVER }}
        run: sed -i "s#__SPECTRA_SERVER__#${SPECTRA_SERVER}#" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
