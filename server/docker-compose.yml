# Spectra — servidor (SFU + tokens + HTTPS).
# Tudo em network_mode: host, porque o WebRTC usa uma faixa grande de portas UDP.
# Os valores vêm do arquivo .env gerado pelo install.sh.

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  token:
    build: ./token
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      SPECTRA_ACCESS_KEY: ${SPECTRA_ACCESS_KEY}
      LIVEKIT_PUBLIC_URL: wss://${SPECTRA_DOMAIN}
      # Limite de tráfego de saída por mês. Ao atingir, o Spectra é bloqueado até o dia 1º.
      SPECTRA_MONTHLY_LIMIT_GB: ${SPECTRA_MONTHLY_LIMIT_GB:-5000}
    volumes:
      - spectra_data:/data

  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      SPECTRA_DOMAIN: ${SPECTRA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  spectra_data:
  caddy_data:
  caddy_config:
